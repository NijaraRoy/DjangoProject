{% extends "loginify/base.html" %}

{% block title %}Delete Account | Loginify{% endblock %}

{% block content %}
    <h1>Delete Account</h1>
    <p class="welcome-message">Are you sure you want to delete the account for <strong>{{ username }}</strong>? This cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn-danger">Yes, delete my account</button>
    </form>
    <p class="card-footer"><a href="{% url 'update_user' email=email %}">Cancel</a></p>
{% endblock %}
