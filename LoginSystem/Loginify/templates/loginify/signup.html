{% extends "loginify/base.html" %}

{% block title %}Signup | Loginify{% endblock %}

{% block content %}
    <h1>Signup</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Signup">
    </form>
    <p class="card-footer">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
{% endblock %}
