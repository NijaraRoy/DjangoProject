{% extends "loginify/base.html" %}

{% block title %}Login | Loginify{% endblock %}

{% block content %}
    <h1>Login</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Login">
    </form>
    <p class="card-footer">Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p>
{% endblock %}
