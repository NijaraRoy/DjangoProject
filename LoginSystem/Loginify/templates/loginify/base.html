{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Loginify{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'loginify/css/style.css' %}">
</head>
<body>
    <div class="page">
        <div class="brand">Loginify</div>
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li class="message {{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        <div class="card">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
