{% extends "loginify/base.html" %}

{% block title %}Update User | Loginify{% endblock %}

{% block content %}
    <h1>Update User</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-secondary">Update</button>
    </form>
    <p class="card-footer"><a href="{% url 'delete_user' email=email %}" class="link-danger">Delete Account</a></p>
{% endblock %}
